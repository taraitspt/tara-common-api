spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:tara_common}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      connection-init-sql: "SET NAMES utf8mb4 COLLATE utf8mb4_general_ci"
  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  # 운영은 Swagger 끈다 — API 지도를 공개하지 않는다.
  swagger:
    enabled: ${APP_SWAGGER_ENABLED:false}
  security:
    # 운영은 nginx 뒤라 기본 true. nginx 가 X-Forwarded-For 를 덮어쓰도록 설정돼 있어야 한다.
    trust-proxy: ${APP_TRUST_PROXY:true}

logging:
  level:
    com.tara.commonapi: INFO
    org.hibernate.SQL: WARN
