# local — DB 설치 없이 바로 띄워 보는 용도. H2 메모리 DB, 재시작하면 데이터가 사라진다.
spring:
  datasource:
    url: jdbc:h2:mem:tara_common;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

logging:
  level:
    com.tara.commonapi: DEBUG
