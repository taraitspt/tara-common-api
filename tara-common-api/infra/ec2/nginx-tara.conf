# tara-common-api — EC2(Ubuntu) 호스트 nginx 설정. setup.sh 가 /etc/nginx/sites-available/ 에 설치한다.
# API 전용 서버라 정적 화면은 없다.
#
# X-Forwarded-For 는 $proxy_add_x_forwarded_for 가 아니라 $remote_addr 로 **덮어쓴다**.
# 앱(IpAllowlistFilter·ApiKeyAuthFilter)이 XFF 의 첫 값을 믿기 때문에, 클라이언트가 보낸 XFF 를 이어 붙이면
# 헤더 하나로 IP 제한을 속일 수 있다. nginx 앞에 ALB 가 붙으면 set_real_ip_from 을 추가한다.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 관리 화면·관리 API — 3중 잠금: ① 관리자 IP(사무실) ② Basic Auth(사무실 안 다른 직원 차단)
    # ③ 실제 동작은 X-Admin-Token 필요. IP 가 바뀌면 allow 수정 후 nginx reload.
    location = /admin.html {
        allow 106.246.247.58;
        deny all;
        auth_basic "tara-common-api admin";
        auth_basic_user_file /etc/nginx/.htpasswd-tara-admin;
        proxy_pass http://127.0.0.1:8080;
    }
    location /api/admin/ {
        allow 106.246.247.58;
        deny all;
        auth_basic "tara-common-api admin";
        auth_basic_user_file /etc/nginx/.htpasswd-tara-admin;
        proxy_pass http://127.0.0.1:8080;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        # Teams 발송은 받는 사람 수에 따라 오래 걸릴 수 있다(Graph 호출 동기).
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Swagger — 앱에서 APP_SWAGGER_ENABLED=true 일 때만 열린다(기본 꺼짐 → 404).
    location /swagger-ui {
        proxy_pass http://127.0.0.1:8080;
    }
    location /v3/api-docs {
        proxy_pass http://127.0.0.1:8080;
    }
    location = /swagger-ui.html {
        proxy_pass http://127.0.0.1:8080;
    }

    # actuator 는 외부에 노출하지 않는다(서버 안에서 curl 127.0.0.1:8080 으로만 확인).
    location /actuator/ {
        return 404;
    }

    location / {
        return 404;
    }
}
